[package]
name = "offramp"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-strkey = { workspace = true }
common-message = { workspace = true }
common-guard = { workspace = true }
common-error = { workspace = true }
common-authorization = { workspace = true }
common-interfaces = { workspace = true }
common-helpers = { workspace = true }
common-pool = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
rmn_proxy = { workspace = true }
rmn_remote = { workspace = true }
# Real CCV stack for the OffRamp↔CommitteeVerifier integration tests — wires a live
# VersionedVerifierResolver → CommitteeVerifier (real ecrecover quorum) behind OffRamp.execute,
# closing the shared root gap of claims 4/5/6 in docs/claims-verification.md.
ccvs-committee-verifier = { path = "../ccvs/committee-verifier" }
ccvs-versioned-verifier-resolver = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }
