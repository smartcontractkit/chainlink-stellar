name: Check Generated Code

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-generated:
    name: Check Generated Code
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Detect CRE artifact input changes
        id: cre_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...HEAD" -- \
              contracts/cre/ contracts/common/ contracts/mcms/ contracts/timelock/ \
              Cargo.toml Cargo.lock rust-toolchain.toml \
              deployment/cre/artifacts/ scripts/update_cre_artifacts.sh \
              | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          wasm32-target: "true"
          rustfmt: "true"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Stellar CLI
        uses: ./.github/actions/setup-stellar-cli

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bindings/go.mod

      - name: Regenerate interfaces and bindings
        run: make generate-bindings

      - name: Rebuild embedded CRE contract artifacts
        if: steps.cre_changes.outputs.changed == 'true'
        run: make update-cre-artifacts

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code -- contracts/common/interfaces/ bindings/contracts/ || \
            (echo "Generated code is out of date. Run 'make generate-bindings' and commit the result." && exit 1)
          git diff --exit-code -- deployment/cre/artifacts/ || \
            (echo "Embedded CRE contract WASM is out of date. Run 'make update-cre-artifacts' and commit the result." && exit 1)
