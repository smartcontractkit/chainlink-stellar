name: E2E TCAPI Tests

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e-tcapi:
    name: E2E TCAPI Tests (${{ matrix.suite }})
    permissions:
      contents: read
      id-token: write
    runs-on: runs-on=${{ github.run_id }}/family=c6i/cpu=32+48/ram=64+96/spot=false/image=ubuntu24-full-x64/extras=s3-cache+tmpfs
    strategy:
      # Two parallel legs: a failure in one must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - suite: basic
            pattern: 'Test(StellarToEVM|EVMToStellar)TCAPI$'
            timeout: 25m
          # One case type x one direction per leg; cases run sequentially
          # inside each leg, so no two sends ever overlap (the EVM send
          # path races same-nonce approve/send txs; the stellar RPC rejects
          # bursts with TRY_AGAIN_LATER).
          - suite: token-transfer-eoa-evm-to-stellar
            pattern: 'TestEVMToStellarTCAPIBnmTokenTransferEOA$'
            timeout: 20m
          - suite: token-transfer-eoa-stellar-to-evm
            pattern: 'TestStellarToEVMTCAPIBnmTokenTransferEOA$'
            timeout: 20m
          - suite: token-transfer-mock-receiver-evm-to-stellar
            pattern: 'TestEVMToStellarTCAPIBnmTokenTransferMockReceiver$'
            timeout: 20m
          - suite: token-transfer-mock-receiver-stellar-to-evm
            pattern: 'TestStellarToEVMTCAPIBnmTokenTransferMockReceiver$'
            timeout: 20m
          - suite: token-transfer-mock-receiver-ff-evm-to-stellar
            pattern: 'TestEVMToStellarTCAPIBnmTokenTransferMockReceiverFastFinality$'
            timeout: 20m
          - suite: token-transfer-mock-receiver-ff-stellar-to-evm
            pattern: 'TestStellarToEVMTCAPIBnmTokenTransferMockReceiverFastFinality$'
            timeout: 20m
          - suite: token-transfer-rate-limit-evm-to-stellar
            pattern: 'TestEVMToStellarTCAPIBnmTokenTransferRateLimit$'
            timeout: 20m
          - suite: token-transfer-rate-limit-stellar-to-evm
            pattern: 'TestStellarToEVMTCAPIBnmTokenTransferRateLimit$'
            timeout: 20m
          - suite: token-transfer-inbound-rate-limit-evm-to-stellar
            pattern: 'TestEVMToStellarTCAPIBnmTokenTransferInboundRateLimit$'
            timeout: 20m
          - suite: token-transfer-inbound-rate-limit-stellar-to-evm
            pattern: 'TestStellarToEVMTCAPIBnmTokenTransferInboundRateLimit$'
            timeout: 20m
          - suite: token-transfer-separate-token-receiver-evm-to-stellar
            pattern: 'TestEVMToStellarTCAPIBnmTokenTransferSeparateTokenReceiver$'
            timeout: 20m
          - suite: token-transfer-separate-token-receiver-stellar-to-evm
            pattern: 'TestStellarToEVMTCAPIBnmTokenTransferSeparateTokenReceiver$'
            timeout: 20m
          - suite: token-transfer-remove-remote-pool-evm-to-stellar
            pattern: 'TestEVMToStellarTCAPIBnmTokenTransferRemoveRemotePool$'
            timeout: 20m
          - suite: token-transfer-remove-remote-pool-stellar-to-evm
            pattern: 'TestStellarToEVMTCAPIBnmTokenTransferRemoveRemotePool$'
            timeout: 20m
    steps:
      - name: Enable S3 Cache for Self-Hosted Runners
        uses: runs-on/action@cd2b598b0515d39d78c38a02d529db87d2196d1e # v2.0.3

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Clone chainlink-ccv (for Docker image builds only)
        uses: ./.github/actions/setup-chainlink-ccv

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          wasm32-target: "true"
          rustfmt: "true"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Stellar CLI
        uses: ./.github/actions/setup-stellar-cli

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate bindings
        run: make generate-bindings

      # No cargo clean here: generate-bindings already built the wasm workspace
      # (gen_interfaces.sh runs stellar contract build), so make build below is a
      # warm rebuild. .dockerignore excludes target/ from the image builds' context.
      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0

      # Image-cache strategy mirrors test-e2e.yaml (shared cache keys): the CCV
      # key rotates only when the ccv pin moves; the Stellar key hashes the Go
      # tree plus both Dockerfiles. Only push-to-main runs save entries.
      - name: Restore CCV dev images
        id: ccv-images
        uses: actions/cache@v5
        with:
          path: /tmp/ccv-dev-images.tar.gz
          key: ccv-dev-images-${{ hashFiles('.github/actions/setup-chainlink-ccv/action.yml') }}

      - name: Load CCV dev images
        if: steps.ccv-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/ccv-dev-images.tar.gz

      # This step assumes the `chainlink-ccv` is a sibling directory.
      - name: Build CCV Docker images
        if: steps.ccv-images.outputs.cache-hit != 'true'
        run: make docker-ccv-dev
        env:
          DOCKER_BUILDKIT: 1

      - name: Save CCV dev images
        if: steps.ccv-images.outputs.cache-hit != 'true' && github.event_name == 'push' && matrix.suite == 'basic'
        run: docker save verifier:dev token-verifier:dev executor:dev indexer:dev aggregator:dev pricer:dev ccv-fakes:dev | gzip > /tmp/ccv-dev-images.tar.gz

      - name: Restore Stellar dev images
        id: stellar-images
        uses: actions/cache@v5
        with:
          path: /tmp/stellar-dev-images.tar.gz
          key: stellar-dev-images-${{ hashFiles('Dockerfile.verifier', 'Dockerfile.executor', '**/*.go', '**/go.mod', '**/go.sum') }}

      - name: Load Stellar dev images
        if: steps.stellar-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/stellar-dev-images.tar.gz

      - name: Build Stellar Docker images
        if: steps.stellar-images.outputs.cache-hit != 'true'
        run: |
          make docker-verifier
          make docker-executor

      - name: Save Stellar dev images
        if: steps.stellar-images.outputs.cache-hit != 'true' && github.event_name == 'push' && matrix.suite == 'basic'
        run: docker save stellarcommittee-verifier:dev stellarexecutor:dev | gzip > /tmp/stellar-dev-images.tar.gz

      - name: Authenticate to AWS ECR (JD)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.JD_IAM_ROLE }}
          aws-region: us-west-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registry-type: private
          registries: ${{ secrets.JD_REGISTRY }}

      - name: Build contracts
        run: make build

      - name: Start devenv
        env:
          JD_IMAGE: ${{ secrets.JD_IMAGE }}
        run: make up

      - name: Run TCAPI ${{ matrix.suite }} e2e tests
        env:
          GOPATH: ${{ github.workspace }}/.go
        run: cd tests && go test -v -timeout ${{ matrix.timeout }} ./e2e/... -run '${{ matrix.pattern }}'

      # tail -5000 rather than tail -50: the executor/aggregator logs are sparse
      # (metrics noise every ~5s aside), so 5000 lines covers the entire run —
      # tail -50 only kept the last ~4 minutes and scrolled out the one-shot
      # per-message lines (e.g. "Found net new message from Indexer",
      # "processing message with ID") logged at message-discovery time.
      - name: Dump container logs
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -5000
          done

      - name: Tear down devenv
        if: always()
        run: make down
