name: Data Feeds Attestation

# SEP-55 build verification for the embedded data feeds WASM. Whenever the
# committed artifacts change on main, rebuild them in the canonical pinned
# container, require the bytes to match what is committed (and therefore what
# CLD deploys), and publish a GitHub build-provenance attestation for them.
# Explorers read source_repo from the on-chain WASM and fetch the attestation
# for its SHA-256 to link the contract to this repo and commit.

on:
  push:
    branches:
      - main
    paths:
      - deployment/data-feeds/artifacts/**
  workflow_dispatch:

permissions: {}

jobs:
  attest:
    name: Build and attest
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Rebuild WASM in the pinned container
        run: ./scripts/update_data_feeds_artifacts.sh

      - name: Require rebuilt WASM to match the committed artifacts
        run: git diff --exit-code -- deployment/data-feeds/artifacts/

      # One attestation per WASM: SEP-55 verifiers only check subject[0].
      - name: Attest data_feeds_cache.wasm
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: deployment/data-feeds/artifacts/data_feeds_cache.wasm

      - name: Attest data_feeds_proxy.wasm
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: deployment/data-feeds/artifacts/data_feeds_proxy.wasm
