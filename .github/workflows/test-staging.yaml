name: Staging Tests (testnet)

# Runs tests/staging against the already-deployed shared testnet lane
# (Stellar testnet → Sepolia) in EPHEMERAL mode: every test generates a
# fresh zero-privilege sender key, funded with XLM from the public testnet
# Friendbot and fee tokens from the DETERMINISTIC FEE issuer — the staging
# fee token is the devenv "FEE" SAC whose issuer key is derived from the
# public network passphrase (deployment/ccip/sac_devenv_token.go's committed
# recipe; verified to match the deployed token). No key or secret exists on
# the Stellar side at all.
#
# Stellar testnet → Sepolia AND EVM → Stellar directions. The EVM direction
# uses an ephemeral Sepolia sender funded from a zero-privilege ETH treasury
# (secret STAGING_EVM_TREASURY_PRIVATE_KEY — holds testnet ETH only, nothing
# else), and its leftover ETH sweeps back to the treasury after every test
# (tests/staging sweepEphemeralETH). TestStagingEVMToStellarTokenTransfer
# skips in ephemeral mode: the Sepolia stgBnM token has no faucet, so it needs
# a non-ephemeral run with a pre-funded persistent EVM sender (README).
#
# NOT PR-triggered on purpose: real testnet fees per run, a shared deployed
# environment (exact receiver-balance assertions, a global OnRamp message
# counter), and ~15-45 min runtimes. Use `workflow_dispatch` (works from a
# PR branch too) to validate a specific change against staging; the nightly
# schedule acts as a canary for drift between the deployed environment and
# the current bindings (e.g. Router ABI changes → MismatchingParameterLen,
# the STAGING_ROUTER_LEGACY_FEE_ARG situation).
#
# One-time setup:
#   1. Secret (environment `staging`, restricted to main + reviewers — the
#      repo is public): STAGING_EVM_TREASURY_PRIVATE_KEY — a dedicated
#      zero-privilege Sepolia key holding only testnet ETH, funded once
#      out-of-band via any public faucet. Its leftover ETH is swept back
#      after every run, so its net consumption is just the ephemeral
#      senders' gas. This is the ONLY setup step: every address below is a
#      public testnet artifact hardcoded from the chainlink-deployments
#      staging_testnet_stellar datastore, and the EVM RPC defaults to
#      Tenderly's keyless public Sepolia gateway (chainId + getLogs +
#      sendRawTransaction verified live; PublicNode's Sepolia endpoint reads
#      fine but propagates submitted transactions ~minutes late — do not use
#      it for sends). Optionally set STAGING_EVM_RPC_URL as a secret to
#      override with a provider URL (Alchemy/Infura free tier).

on:
  # TEMPORARY: run on every push to see the workflow working end-to-end.
  # Real testnet fees per push — remove this block (keep workflow_dispatch +
  # schedule) once the first green run is confirmed.
  push:
  workflow_dispatch:
    inputs:
      legacy_fee_arg:
        description: "STAGING_ROUTER_LEGACY_FEE_ARG (true ONLY for pre-bbc2d2b4 Routers; the deployed staging Router was redeployed and uses the 3-arg ccip_send — verified by direct simulation 2026-11-20)"
        type: boolean
        default: false
  schedule:
    # Nightly env-drift canary; off-round minute to spread load.
    - cron: "17 5 * * *"

# Serialize globally: concurrent runs share the lane's message counter and
# the deployed receivers' balances (exact-delta assertions), and the same
# treasuries. Never cancel mid-run — a half-sent batch leaves unattributed
# on-chain state.
concurrency:
  group: staging-tests
  cancel-in-progress: false

permissions: {}

jobs:
  test-staging:
    name: Staging Tests (testnet, ephemeral senders)
    # Latency-bound (Sepolia finality waits), not CPU-bound.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # Ephemeral mode, both directions. Every address below is a public
      # testnet artifact from the chainlink-deployments staging_testnet_stellar
      # datastore (address_refs.json) — verified against it digit-for-digit
      # (hex ids converted to C… strkeys, which the test config requires for
      # Router/CCVs/OffRamp). The ONLY secret is the zero-privilege Sepolia
      # ETH treasury key. The CCVs entry is the VersionedVerifierResolver
      # (CommitteeVerifierResolver in the datastore), NOT the raw
      # CommitteeVerifier — the OnRamp resolves each CCV as a VVR via
      # get_outbound_implementation.
      - name: Run staging tests (both directions)
        env:
          STAGING_EPHEMERAL: "true"
          # FTF: request FinalityWaitForSafe (0x00010000) on EVM→Stellar sends —
          # verifiers sign at the Ethereum safe head (~1-2 min) instead of two
          # Sepolia epochs (~13 min). Requires the env to admit it: EVM-side CV
          # + executor allowed-finality configs, and the Stellar receiver's
          # enable_remote_chain allowed_finality_config=65536 (README). Set 0
          # to fall back to full finality (and raise the timeouts — the suite
          # then needs ~35m).
          STAGING_EVM_FINALITY: "65536"
          # 3-arg ccip_send: the deployed staging Router was redeployed to the
          # post-bbc2d2b4 ABI (verified 2026-11-20 by direct simulation — the
          # legacy 4-arg call aborts with MismatchingParameterLen wrapped in
          # WasmVm UnexpectedSize, which masqueraded as an archived-WASM issue
          # for three CI rounds). legacy_fee_arg stays available as a dispatch
          # input for environments with an old Router.
          STAGING_ROUTER_LEGACY_FEE_ARG: ${{ inputs.legacy_fee_arg || 'false' }}
          STAGING_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STAGING_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          STAGING_STELLAR_ROUTER: CBSIDUUE42ELJV5ZTVA4Z5GBLOQEZPFZQXPNVGTEA2O7OOQULDU5INVR
          STAGING_STELLAR_CCVS: CBQPQUWBTFAIXIVWG3BZVVHQ6GZE7ZWE7MXJY4VEWIFG5CJT72S72L4O
          STAGING_STELLAR_OFFRAMP: CC5LAOQJES3RGUHNDNV6G6P2LYR7AGXW3LIX3FNYIAAYLFGPRJI6S53P
          STAGING_STELLAR_RECEIVER: CAQVG6KGJWTEHOXBVRFBBHRXTVI4SK5KACSW7IHF7YM42B5V6X6OI4FK
          STAGING_STELLAR_FEE_TOKEN: CDFAZQDPCAIC7ZAK22ZT66N3HM3AXNMUAKOTPASEEKM5O4VZKIEUJJDV
          STAGING_STELLAR_TOKEN: CDJXOQB6QNN2SZMKCKVF2QMDP2YR5WG54R4EJKHHJKABAN4CWNBAVQ2A
          STAGING_STELLAR_TOKEN_POOL: CBGEPJNRH5MCA5QWMBXLMYVIK6QFR3MBWVS7KJQ26BZ3DZANXXHPXEMT
          # PublicNode's Sepolia endpoint was live-verified for reads but its
          # eth_sendRawTransaction propagates extremely slowly (transfers with
          # 1-gwei tips took ~9 minutes to mine — two CI rounds of evidence),
          # so the default is Tenderly's public Sepolia gateway (send pipeline
          # verified live). Set STAGING_EVM_RPC_URL as a secret to override
          # with any provider URL (Alchemy/Infura free tier) if this also
          # misbehaves.
          STAGING_EVM_RPC_URL: ${{ secrets.STAGING_EVM_RPC_URL || 'https://gateway.tenderly.co/public/sepolia' }}
          STAGING_EVM_TREASURY_PRIVATE_KEY: ${{ secrets.STAGING_EVM_TREASURY_PRIVATE_KEY }}
          STAGING_EVM_RECEIVER: "0xcf55123F4f256c719F86d695F16D40a2855ce0DF"
          STAGING_EVM_ROUTER: "0x140Ce0d34F9eaA4B475a0184D47fc71DcB67C8D9"
          STAGING_EVM_OFFRAMP: "0x48c903a26A0b5bDA0F5C8d700810377694FED265"
          STAGING_EVM_TOKEN: "0x52627841876bbf1839dfeC397901bc85b0da8030"
          STAGING_EVM_TOKEN_POOL: "0x76e359670262a1E21B917017Ab87D9372476d2b0"
        run: cd tests && go test -v -count=1 -timeout 20m ./staging/... -run 'TestStagingStellarToEVM|TestStagingEVMToStellar'

      # No teardown, no artifacts: nothing is deployed or started — the
      # shared environment stays as it is. Ephemeral Stellar senders'
      # leftover XLM/LINK dust is abandoned by design; ephemeral EVM senders
      # (when that direction is enabled) sweep their leftover ETH back to
      # the treasury via t.Cleanup (see helpers_test.go sweepEphemeralETH).
