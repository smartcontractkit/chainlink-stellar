name: E2E Tests

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e:
    name: E2E Tests
    permissions:
      contents: read
      id-token: write
    runs-on: runs-on=${{ github.run_id }}/family=c6i/cpu=32+48/ram=64+96/spot=false/image=ubuntu24-full-x64/extras=s3-cache+tmpfs
    steps:
      - name: Enable S3 Cache for Self-Hosted Runners
        uses: runs-on/action@cd2b598b0515d39d78c38a02d529db87d2196d1e # v2.0.3

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Clone chainlink-ccv (for Docker image builds only)
        uses: ./.github/actions/setup-chainlink-ccv

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          wasm32-target: "true"
          rustfmt: "true"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Stellar CLI
        uses: ./.github/actions/setup-stellar-cli

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate bindings
        run: make generate-bindings

      - name: Clean Cargo artifacts
        run: cargo clean

      - name: Install just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      # The dev images are cached so a cold runner does not pay the full 7-service
      # CCV + 2-service Stellar rebuild (~19 min) every run. The CCV image cache key
      # is the ccv pin recorded in the setup-chainlink-ccv action (REF/EXPECTED_SHA),
      # so it only rotates when the pin is bumped — the common case is a cache hit.
      # The Stellar image cache key hashes the whole Go tree plus both Dockerfiles,
      # because the Dockerfiles build from `COPY . .`; it only hits when no relevant
      # source changed, but then it saves two full Go builds.
      - name: Restore CCV dev images
        id: ccv-images
        uses: actions/cache@v5
        with:
          path: /tmp/ccv-dev-images.tar.gz
          key: ccv-dev-images-${{ hashFiles('.github/actions/setup-chainlink-ccv/action.yml') }}

      - name: Load CCV dev images
        if: steps.ccv-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/ccv-dev-images.tar.gz

      # This step assumes the `chainlink-ccv` is a sibling directory.
      - name: Build CCV Docker images
        if: steps.ccv-images.outputs.cache-hit != 'true'
        run: make docker-ccv-dev
        env:
          DOCKER_BUILDKIT: 1

      - name: Save CCV dev images
        # Only push-to-main runs save: PR/merge-group runs restore the entry a
        # main push created (same base), and PR-keyed entries would just fill
        # the 10 GB repo cache with single-run duplicates.
        if: steps.ccv-images.outputs.cache-hit != 'true' && github.event_name == 'push'
        run: docker save verifier:dev token-verifier:dev executor:dev indexer:dev aggregator:dev pricer:dev ccv-fakes:dev | gzip > /tmp/ccv-dev-images.tar.gz

      - name: Restore Stellar dev images
        id: stellar-images
        uses: actions/cache@v5
        with:
          path: /tmp/stellar-dev-images.tar.gz
          key: stellar-dev-images-${{ hashFiles('Dockerfile.verifier', 'Dockerfile.executor', '**/*.go', '**/go.mod', '**/go.sum') }}

      - name: Load Stellar dev images
        if: steps.stellar-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/stellar-dev-images.tar.gz

      - name: Build Stellar Docker images
        if: steps.stellar-images.outputs.cache-hit != 'true'
        run: |
          make docker-verifier
          make docker-executor

      - name: Save Stellar dev images
        # Only push-to-main runs save (see Save CCV dev images).
        if: steps.stellar-images.outputs.cache-hit != 'true' && github.event_name == 'push'
        run: docker save stellarcommittee-verifier:dev stellarexecutor:dev | gzip > /tmp/stellar-dev-images.tar.gz

      - name: Authenticate to AWS ECR (JD)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.JD_IAM_ROLE }}
          aws-region: us-west-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registry-type: private
          registries: ${{ secrets.JD_REGISTRY }}

      - name: Build contracts
        run: make build

      - name: Start devenv
        env:
          JD_IMAGE: ${{ secrets.JD_IMAGE }}
        run: make up

      - name: Run E2E tests
        env:
          GOPATH: ${{ github.workspace }}/.go
        run: cd tests && go test -v -timeout 25m ./e2e/...

      - name: Dump container logs
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -50
          done

      - name: Tear down devenv
        if: always()
        run: make down
