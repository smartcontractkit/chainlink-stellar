name: Data Feeds Contracts

on:
  merge_group:
  pull_request:
    paths:
      - contracts/data-feeds/**
      - .github/workflows/data-feeds-contracts.yaml
      - .github/actions/setup-rust-toolchain/**
      - .github/actions/setup-stellar-cli/**
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Unit Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/data-feeds
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: contracts/data-feeds

      - name: Install Just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0

      - name: Run tests
        run: just test

  lint:
    name: Lint and Format
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/data-feeds
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: contracts/data-feeds

      - name: Install Just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just lint

  build-wasm:
    name: Build WASM
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/data-feeds
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: contracts/data-feeds

      - name: Install Just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0

      - name: Install Stellar CLI
        uses: ./.github/actions/setup-stellar-cli
        with:
          version: "27.0.0"
          shasum: "357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556"

      - name: Build contract WASMs
        run: just build
