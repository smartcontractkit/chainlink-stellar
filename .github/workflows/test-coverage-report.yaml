name: Test Coverage Report

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-coverage-report:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Clone chainlink-ccv
        uses: ./.github/actions/setup-chainlink-ccv

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          cache: true
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Populate go envs
        run: |
          echo "GOBIN=$(go env GOPATH)/bin" >> $GITHUB_ENV
          echo "GOCACHE=$(go env GOPATH)/build" >> $GITHUB_ENV

      - name: Cache Go toolchain artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.GOBIN }}
            ${{ env.GOCACHE }}
          key: chainlink-stellar-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            chainlink-stellar-go-${{ runner.os }}-

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0

      - name: Run tests (current ref)
        run: |
          just test-coverage coverage.out short

      - name: Run bindings tests
        run: |
          just test-go-bindings

      - name: Run tests-module unit tests
        run: |
          just test-go-tests

      - name: Coverage on target branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git checkout "origin/${{ github.base_ref }}"
          just test-coverage coverage_target.out short
          git checkout "${{ github.sha }}"
          ./tools/bin/cov_compare.sh --no-header coverage_target.out coverage.out > table.txt
          cat table.txt
          {
            echo 'coverage_report<<COVERAGE_REPORT_DELIM'
            cat table.txt
            echo 'COVERAGE_REPORT_DELIM'
          } >> "$GITHUB_ENV"

      - name: Remove previous coverage comments
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo, number: issue_number } = context.issue;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });
            const coverageCommentPrefix = "Code coverage report:";
            for (const comment of comments.data) {
              if (comment.body.startsWith(coverageCommentPrefix)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id
                });
              }
            }

      - name: Display coverage in PR comment
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Read branch names from the event payload, not from workflow-expression
            // expansion: the head branch name is the PR author's and must never be
            // interpolated into this script (it would execute as JS with this token).
            const pr = context.payload.pull_request;
            const coverage_report = process.env.coverage_report;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Code coverage report:\n| Top package | \`${pr.base.ref}\` | \`${pr.head.ref}\` | diff |\n${coverage_report}`
            });
