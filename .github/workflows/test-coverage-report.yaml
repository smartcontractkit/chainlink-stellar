name: Test Coverage Report

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-coverage-report:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No fetch-depth 0: the base ref is fetched explicitly below, and nothing
      # in this job diffs history.
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          cache: true
          go-version-file: go.mod
          # This job tests the root, bindings and tests modules.
          cache-dependency-path: |
            go.sum
            bindings/go.sum
            tests/go.sum

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0

      - name: Run tests (current ref)
        run: |
          just test-coverage coverage.out short

      - name: Run bindings tests
        run: |
          just test-go-bindings

      - name: Run tests-module unit tests
        run: |
          just test-go-tests

      - name: Get base SHA
        id: base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          echo "sha=$(git rev-parse "origin/${{ github.base_ref }}")" >> "$GITHUB_OUTPUT"

      # The base-branch coverage run is identical for every PR push until the
      # base moves, so cache it by base SHA (one base run per merge instead of
      # one per push). No restore-keys: a stale base would corrupt the diff.
      - name: Restore base coverage
        id: base-cov
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: coverage_target.out
          key: coverage-base-${{ github.base_ref }}-${{ steps.base.outputs.sha }}

      - name: Coverage on target branch
        if: github.event_name == 'pull_request' && steps.base-cov.outputs.cache-hit != 'true'
        run: |
          git checkout "origin/${{ github.base_ref }}"
          just test-coverage coverage_target.out short
          git checkout "${{ github.sha }}"

      - name: Compare coverage
        if: github.event_name == 'pull_request'
        run: |
          ./tools/bin/cov_compare.sh --no-header coverage_target.out coverage.out > table.txt
          cat table.txt
          {
            echo 'coverage_report<<COVERAGE_REPORT_DELIM'
            cat table.txt
            echo 'COVERAGE_REPORT_DELIM'
          } >> "$GITHUB_ENV"

      - name: Remove previous coverage comments
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo, number: issue_number } = context.issue;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });
            const coverageCommentPrefix = "Code coverage report:";
            for (const comment of comments.data) {
              if (comment.body.startsWith(coverageCommentPrefix)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id
                });
              }
            }

      - name: Display coverage in PR comment
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Read branch names from the event payload, not from workflow-expression
            // expansion: the head branch name is the PR author's and must never be
            // interpolated into this script (it would execute as JS with this token).
            const pr = context.payload.pull_request;
            const coverage_report = process.env.coverage_report;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Code coverage report:\n| Top package | \`${pr.base.ref}\` | \`${pr.head.ref}\` | diff |\n${coverage_report}`
            });
